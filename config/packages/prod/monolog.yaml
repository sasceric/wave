monolog:
    handlers:
        main:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            max_files: "%env(int:LOG_RETENTION_DAYS)%"
            level: warning
            channels: ["!event", "!deprecation", "!background"]
            formatter: monolog.formatter.json
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
        background:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.background.log"
            max_files: "%env(int:LOG_RETENTION_DAYS)%"
            level: info
            channels: [background]
            formatter: monolog.formatter.json
        deprecation:
            type: rotating_file
            channels: [deprecation]
            path: "%kernel.logs_dir%/%kernel.environment%.deprecation.log"
            max_files: "%env(int:LOG_RETENTION_DAYS)%"
            level: info
