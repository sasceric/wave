<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{heading}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f3ee;color:#203d38;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{preheader}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#f4f3ee;">
    <tr>
      <td align="center" style="padding:36px 16px 40px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;">
          <tr>
            <td style="padding:0 4px 22px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td align="center" valign="middle" width="34" height="34" style="width:34px;height:34px;border-radius:50%;background-color:#e7967c;color:#173c35;font-family:Georgia,serif;font-size:19px;font-weight:bold;">w</td>
                  <td style="padding-left:10px;color:#173c35;font-family:Georgia,'Times New Roman',serif;font-size:23px;font-weight:bold;letter-spacing:-1px;">wave</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0;background-color:#ffffff;border:1px solid #e1e4df;border-top:4px solid #e7967c;border-radius:10px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="padding:42px 44px 12px;">
                    <p style="margin:0 0 14px;color:#71847b;font-size:11px;font-weight:bold;letter-spacing:1.5px;line-height:1.5;text-transform:uppercase;">{{eyebrow}}</p>
                    <h1 style="margin:0;color:#173c35;font-family:Georgia,'Times New Roman',serif;font-size:31px;font-weight:normal;letter-spacing:-.5px;line-height:1.2;">{{heading}}</h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:12px 44px 0;color:#465b54;font-size:15px;line-height:1.75;">
                    <p style="margin:0 0 14px;">{{greeting}}</p>
                    <p style="margin:0;">{{message}}</p>
                  </td>
                </tr>
                <tr>
                  <td align="left" style="padding:28px 44px 24px;">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#173c35" style="border-radius:4px;background-color:#173c35;">
                          <a href="{{actionUrl}}" target="_blank" style="display:inline-block;padding:15px 23px;border:1px solid #173c35;border-radius:4px;color:#ffffff;font-size:14px;font-weight:bold;line-height:1.3;text-align:center;text-decoration:none;">{{buttonLabel}}<span style="padding-left:10px;color:#f0c078;">&#8599;</span></a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 44px 25px;color:#77847e;font-size:12px;line-height:1.65;">
                    <p style="margin:0 0 7px;">{{expiration}}</p>
                    <p style="margin:0 0 13px;">{{security}}</p>
                    <p style="margin:0 0 6px;">{{fallback}}</p>
                    <a href="{{actionUrl}}" target="_blank" style="color:#42675b;overflow-wrap:anywhere;word-break:break-word;">{{actionUrl}}</a>
                  </td>
                </tr>
                <tr>
                  <td style="padding:19px 44px;border-top:1px solid #edf0ec;color:#8a948f;font-size:11px;line-height:1.6;">
                    {{footer}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
