# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Bots and scanners request unknown paths or POST to pages; these are answered
    # with 404/405 and are not application errors, so keep them out of the error log.
    exceptions:
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
            log_level: info
        Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException:
            log_level: info

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_lifetime: 7776000
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
        gc_maxlifetime: 7776000

    rate_limiter:
        wave_chat_preview:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
        wave_public_search:
            policy: 'sliding_window'
            limit: 240
            interval: '1 minute'
        # Public directory API (creators, companies, campaigns); see DirectoryRateLimitSubscriber.
        wave_directory_visitor:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
        wave_directory_member:
            policy: sliding_window
            limit: 600
            interval: '1 minute'
        wave_profile_views_visitor:
            policy: sliding_window
            limit: 500
            interval: '24 hours'
        wave_profile_views_member:
            policy: sliding_window
            limit: 3000
            interval: '24 hours'
        wave_password_change:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        wave_search_history:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        wave_credit_redeem:
            policy: sliding_window
            limit: 10
            interval: "15 minutes"
        wave_login_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        wave_login_identity:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        wave_register_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        wave_verification_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        wave_verification_identity:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        wave_email_template_test:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        wave_registration_reminder:
            policy: sliding_window
            limit: 1
            interval: '24 hours'
        wave_password_reset_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        wave_password_reset_identity:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        wave_support_ip:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        wave_support_reply:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'
        wave_support_tracking:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        wave_contact_ip:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        wave_newsletter_ip:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

    #esi: true
    #fragments: true
