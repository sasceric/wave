; Alternative to systemd. Do not run both consumer managers.
[program:wave-realtime]
command=/usr/bin/php8.4 bin/console messenger:consume realtime --env=prod --no-debug --time-limit=3600 --memory-limit=192M --sleep=1 --no-interaction
directory=/home/steelcodeweb/web/wave.ba/public_html
user=steelcodeweb
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=120
stopsignal=TERM
environment=APP_ENV="prod",APP_DEBUG="0"
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wave-realtime.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

