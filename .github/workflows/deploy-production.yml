name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to wave.ba
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          script: |
            set -e
            cd /home/steelcodeweb/web/wave.ba/public_html/
            if ! git diff --quiet HEAD -- composer.lock; then
              lockfile_backup="var/deploy-backups/composer.lock.$(date -u +%Y%m%dT%H%M%SZ).patch"
              mkdir -p "$(dirname "$lockfile_backup")"
              git diff --binary HEAD -- composer.lock > "$lockfile_backup"
              echo "Saved server-local composer.lock changes to $lockfile_backup; restoring the tracked lockfile before deploy."
              git restore --source=HEAD --staged --worktree -- composer.lock
            fi
            git pull --ff-only origin main
            COMPOSER_ALLOW_SUPERUSER=1 APP_ENV=prod php8.4 "$(command -v composer)" install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            COMPOSER_ALLOW_SUPERUSER=1 APP_ENV=prod php8.4 "$(command -v composer)" dump-env prod
            node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 22 || minor < 12) { console.error("Node.js 22.12+ is required"); process.exit(1); }'
            cd frontend
            npm ci
            npm run build
            cd ..
            APP_ENV=prod php8.4 bin/console doctrine:migrations:migrate --no-interaction
            APP_ENV=prod php8.4 bin/console cache:clear
            APP_ENV=prod php8.4 bin/console app:scheduled-tasks register --no-interaction
            chown -R steelcodeweb:steelcodeweb /home/steelcodeweb/web/wave.ba/public_html/var
            chmod -R u+rwX /home/steelcodeweb/web/wave.ba/public_html/var
            APP_ENV=prod php8.4 bin/console messenger:stop-workers --no-interaction
