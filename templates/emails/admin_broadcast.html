<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{heading}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f3ee;color:#203d38;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{preheader}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#f4f3ee;">
    <tr>
      <td align="center" style="padding:36px 16px 40px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;">
          <tr>
            <td style="padding:0 4px 22px;">
              <!-- wave:brand -->
            </td>
          </tr>
          <tr>
            <td style="padding:0;background-color:#ffffff;border:1px solid #e1e4df;border-top:4px solid #e7967c;border-radius:10px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="padding:42px 44px 8px;">
                    <h1 style="margin:0;color:#173c35;font-family:Georgia,'Times New Roman',serif;font-size:29px;font-weight:normal;letter-spacing:-.4px;line-height:1.25;">{{heading}}</h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:16px 44px 0;color:#465b54;font-size:15px;line-height:1.75;">
                    <div style="margin:0;white-space:pre-line;">{{message}}</div>
                  </td>
                </tr>
                <tr>
                  <td align="left" style="padding:28px 44px 30px;">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#173c35" style="border-radius:4px;background-color:#173c35;">
                          <a href="{{actionUrl}}" target="_blank" style="display:inline-block;padding:15px 23px;border:1px solid #173c35;border-radius:4px;color:#ffffff;font-size:14px;font-weight:bold;line-height:1.3;text-align:center;text-decoration:none;">{{buttonLabel}}</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:19px 44px;border-top:1px solid #edf0ec;color:#8a948f;font-size:11px;line-height:1.6;">
                    <p style="margin:0 0 6px;">{{footer}}</p>
                    <a href="{{settingsUrl}}" target="_blank" style="color:#42675b;">{{settingsLabel}}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
