monolog:
    handlers:
        main:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            max_files: "%env(int:LOG_RETENTION_DAYS)%"
            level: warning
            channels: ["!event", "!background", "!search"]
            formatter: monolog.formatter.json
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine", "!console"]
        background:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.background.log"
            max_files: "%env(int:LOG_RETENTION_DAYS)%"
            level: info
            channels: [background]
            formatter: monolog.formatter.json
