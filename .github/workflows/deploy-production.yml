name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to wave.ba
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          script: |
            set -e
            cd /home/steelcodeweb/web/wave.ba/public_html/
            git pull --ff-only origin main
            APP_ENV=prod php8.4 "$(command -v composer)" install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "nvm not found at $NVM_DIR/nvm.sh" >&2
              exit 1
            fi
            . "$NVM_DIR/nvm.sh"
            nvm use 22
            cd frontend
            npm ci
            npm run build
            cd ..
            APP_ENV=prod php8.4 bin/console doctrine:migrations:migrate --no-interaction
            APP_ENV=prod php8.4 bin/console cache:clear
